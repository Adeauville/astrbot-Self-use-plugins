name: 自动打包插件ZIP + 发布Release

# 触发条件：
# 1. 任意分支 push 代码 → 自动打包，生成 Artifact（临时下载）
# 2. 打 tag（格式 v*.*.*，例如 v1.0.0）→ 自动创建 Release 并上传 zip 附件（永久保存）
on:
  push:
    branches: [ '*' ]
  create:
    tags: [ 'v*.*.*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 打包当前分支为 ZIP（排除 .github 和 .git）
        run: |
          # 用分支名作为 zip 文件名，避免重名
          BRANCH_NAME="${GITHUB_REF_NAME}"
          # 把斜杠、特殊字符替换掉，防止文件名非法
          SAFE_NAME=$(echo "$BRANCH_NAME" | tr '/\\' '-' | tr -cd '[:alnum:]._-')
          zip -r "${SAFE_NAME}.zip" . -x ".github/*" ".git/*"
          echo "ZIP_FILE=${SAFE_NAME}.zip" >> $GITHUB_ENV

      - name: 上传打包产物（Artifact，临时90天）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-插件包
          path: ${{ env.ZIP_FILE }}

      # 只有打 tag 时才执行：自动创建 Release 并上传 zip
      - name: 创建 Release 并上传 ZIP 附件
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_FILE }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
